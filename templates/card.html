<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  /* 본문용 Medium(2026-11-15) — 전부 굵은 글씨라 제목·본문 위계가 없었다 */
  @font-face {
    font-family: 'Pretendard';
    src: url('../fonts/Pretendard-Medium.otf') format('opentype');
    font-weight: 400 600;
  }
  @font-face {
    font-family: 'Pretendard';
    src: url('../fonts/Pretendard-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Pretendard';
    src: url('../fonts/Pretendard-ExtraBold.ttf') format('truetype');
    font-weight: 800;
  }
  @font-face {
    font-family: 'Pretendard';
    src: url('../fonts/Pretendard-Black.ttf') format('truetype');
    font-weight: 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  .card {
    position: relative; width: 1080px; height: 1350px;
    font-family: 'Pretendard', sans-serif; color: #FFFFFF;
  }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 1; }
  .overlay {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(180deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.75) 50%, rgba(0,0,0,0.90) 100%);
  }
  .content {
    position: absolute; inset: 0; z-index: 3; padding: 80px;
    display: flex; flex-direction: column;
    text-align: left; align-items: flex-start;
  }

  /* 카드1 후킹 — 흰 제목 2줄 + 부제 2줄(포인트 단어만 연두), 총 4줄 */
  .hook-title { margin-top: 250px; font-weight: 900; line-height: 1.12; text-align: left; }
  /* 자간은 각 .line에 — 축소된 실제 폰트 크기 기준으로 계산돼야 함 */
  .hook-title .line { display: block; white-space: nowrap; letter-spacing: -0.0333em; }
  .hook-sub {
    margin-top: 64px; text-align: left; color: #FFFFFF;
    max-width: 920px; word-break: keep-all;
  }
  .hook-sub .sub1 { font-weight: 500; line-height: 1.4; letter-spacing: -0.0347em; }
  .hook-sub .sub2 { font-weight: 900; line-height: 1.3; margin-top: 10px; letter-spacing: -0.0272em; }
  /* 강조는 장당 하나, 연두 블록 위 검은 글씨(릴스와 같은 문법) */
  .hook-sub b, .ana-body b, .ins-body b {
    color: #0A0C0D; background: #CFFF04; font-weight: 800;
    padding: 0 0.14em; border-radius: 0.1em; -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }

  /* 카드2 분석 & 카드3 통찰 - 제목 스타일 통일 */
  .ana-wrap, .ins-wrap { margin-top: auto; margin-bottom: auto; display: flex; flex-direction: column; justify-content: center; width: 100%; }
  .ana-subtitle, .ins-title {
    font-size: 92px; font-weight: 900; line-height: 1.2; text-align: left;
    border-left: 14px solid #CFFF04; padding-left: 34px;
    word-break: keep-all; letter-spacing: -0.0326em;
  }
  .ana-body, .ins-body { margin-top: 56px; font-size: 64px; font-weight: 500; line-height: 1.6; text-align: left; }
  .ana-body .line, .ins-body .line { display: block; white-space: nowrap; margin-bottom: 14px; letter-spacing: -0.0234em; }


  /* 카드4 저장용 요약 — 연두 바탕에 검정 박스. 사진 없이 순수 정보면이라
     Pexels 사진 품질과 무관하게 항상 또렷하다(저장 직전 마지막 화면). */
  .sum-wrap {
    margin-top: auto; margin-bottom: auto; width: 100%;
    display: flex; flex-direction: column;
  }
  .sum-headline {
    font-size: 92px; font-weight: 900; line-height: 1.12;
    letter-spacing: -0.0326em; color: #0A0C0D; word-break: keep-all;
  }
  /* 2026-11-23: 라벨(작은 연두)·값(큰 흰 글씨) 두 줄 — 번호 열을 빼고 값에 폭을 몰아줬다 */
  .sum-box {
    margin-top: 48px; padding: 52px 56px; background: #0A0C0D; color: #F5F7F4;
    clip-path: polygon(30px 0, 100% 0, 100% 100%, 0 100%, 0 30px);
  }
  .sum-item {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 36px; word-break: keep-all;
  }
  .sum-item:last-child { margin-bottom: 0; }
  .sum-label {
    font-size: 36px; font-weight: 700; color: #CFFF04; line-height: 1.3; letter-spacing: -0.02em;
  }
  .sum-text { font-weight: 800; line-height: 1.25; letter-spacing: -0.0234em; white-space: nowrap; }
  .sum-text b { color: #CFFF04; font-weight: 900; }
  .sum-closing {
    margin-top: 44px; font-size: 50px; font-weight: 800; line-height: 1.3;
    letter-spacing: -0.0234em; color: #0A0C0D; word-break: keep-all;
  }

  /* 카드5 행동 유도(2026-11-23) — 로고만 있던 빈 장 대신 저장·공유·팔로우. 강조색은 연두 하나 */
  .cta-wrap { margin-top: auto; margin-bottom: auto; width: 100%; display: flex; flex-direction: column; }
  .cta-q {
    font-size: 96px; font-weight: 900; line-height: 1.15; letter-spacing: -0.0326em;
    color: #FFFFFF; word-break: keep-all;
  }
  .cta-q b { background: #CFFF04; color: #0A0C0D; padding: 0 14px; font-weight: 900; }
  .cta-list { margin-top: 72px; display: flex; flex-direction: column; gap: 22px; }
  .cta-row {
    display: grid; grid-template-columns: 210px 1fr; align-items: center;
    padding: 34px 40px; border: 3px solid #2A2E30; border-radius: 22px;
  }
  .cta-k { font-size: 50px; font-weight: 900; color: #CFFF04; letter-spacing: -0.02em; }
  .cta-v { font-size: 42px; font-weight: 500; color: #E8EAE6; letter-spacing: -0.02em; white-space: nowrap; }
  .cta-brand {
    margin-top: 72px; display: flex; align-items: center; gap: 22px;
    font-size: 40px; font-weight: 500; color: #9AA09C;
  }
  .cta-brand b { color: #FFFFFF; font-weight: 900; margin-right: 10px; }
  .cta-g {
    width: 76px; height: 76px; border-radius: 50%; background: #CFFF04; color: #0A0C0D;
    display: inline-flex; align-items: center; justify-content: center; font-size: 46px; font-weight: 900;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="bg" id="bg"></div>
    <div class="overlay" id="overlay"></div>
    <div class="content" id="content">
      <div id="body-area" style="display:flex;flex-direction:column;flex:1;width:100%;"></div>
    </div>
  </div>
</body>
</html>
