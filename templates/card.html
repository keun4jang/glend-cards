<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('../fonts/Pretendard-Bold.ttf') format('truetype');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'Pretendard';
    src: url('../fonts/Pretendard-ExtraBold.ttf') format('truetype');
    font-weight: 800;
  }
  @font-face {
    font-family: 'Pretendard';
    src: url('../fonts/Pretendard-Black.ttf') format('truetype');
    font-weight: 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  .card {
    position: relative; width: 1080px; height: 1350px;
    font-family: 'Pretendard', sans-serif; color: #FFFFFF;
  }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 1; }
  .overlay {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(180deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.75) 50%, rgba(0,0,0,0.90) 100%);
  }
  .content {
    position: absolute; inset: 0; z-index: 3; padding: 80px;
    display: flex; flex-direction: column;
    text-align: left; align-items: flex-start;
  }

  /* 카드1 후킹 — 흰 제목 2줄 + 부제 2줄(포인트 단어만 연두), 총 4줄 */
  .hook-title { margin-top: 250px; font-weight: 900; line-height: 1.12; text-align: left; }
  /* 자간은 각 .line에 — 축소된 실제 폰트 크기 기준으로 계산돼야 함 */
  .hook-title .line { display: block; white-space: nowrap; letter-spacing: -0.0333em; }
  .hook-sub {
    margin-top: 64px; text-align: left; color: #FFFFFF;
    max-width: 920px; word-break: keep-all;
  }
  .hook-sub .sub1 { font-weight: 800; line-height: 1.4; letter-spacing: -0.0347em; }
  .hook-sub .sub2 { font-weight: 900; line-height: 1.3; margin-top: 10px; letter-spacing: -0.0272em; }
  .hook-sub b { color: #CFFF04; font-weight: inherit; }

  /* 카드2 분석 & 카드3 통찰 - 제목 스타일 통일 */
  .ana-wrap, .ins-wrap { margin-top: auto; margin-bottom: auto; display: flex; flex-direction: column; justify-content: center; width: 100%; }
  .ana-subtitle, .ins-title {
    font-size: 92px; font-weight: 900; line-height: 1.2; text-align: left;
    border-left: 14px solid #CFFF04; padding-left: 34px;
    word-break: keep-all; letter-spacing: -0.0326em;
  }
  .ana-body, .ins-body { margin-top: 56px; font-size: 64px; font-weight: 700; line-height: 1.6; text-align: left; }
  .ana-body .line, .ins-body .line { display: block; white-space: nowrap; margin-bottom: 14px; letter-spacing: -0.0234em; }
  .ana-body b, .ins-body b { font-weight: 900; color: #CFFF04; }


  /* 카드4 저장용 요약 — 연두 바탕에 검정 박스. 사진 없이 순수 정보면이라
     Pexels 사진 품질과 무관하게 항상 또렷하다(저장 직전 마지막 화면). */
  .sum-wrap {
    margin-top: auto; margin-bottom: auto; width: 100%;
    display: flex; flex-direction: column;
  }
  .sum-headline {
    font-size: 76px; font-weight: 900; line-height: 1.15;
    letter-spacing: -0.0326em; color: #0A0C0D; word-break: keep-all;
  }
  .sum-box {
    margin-top: 52px; padding: 56px 52px; background: #0A0C0D; color: #F5F7F4;
    clip-path: polygon(30px 0, 100% 0, 100% 100%, 0 100%, 0 30px);
  }
  .sum-item {
    display: grid; grid-template-columns: 76px 1fr; gap: 18px; align-items: start;
    margin-bottom: 34px; word-break: keep-all;
  }
  .sum-item:last-child { margin-bottom: 0; }
  .sum-num {
    font-size: 46px; font-weight: 900; color: #CFFF04; line-height: 1.35;
  }
  .sum-text { font-weight: 700; line-height: 1.35; letter-spacing: -0.0234em; }
  .sum-text b { color: #CFFF04; font-weight: 900; }
  .sum-closing {
    margin-top: 46px; font-size: 44px; font-weight: 800; line-height: 1.35;
    letter-spacing: -0.0234em; color: #0A0C0D; word-break: keep-all;
  }

  /* 카드5 브랜딩 */
  .brand-logo-full { position: absolute; inset: 0; z-index: 3; width: 1080px; height: 1350px; object-fit: cover; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="bg" id="bg"></div>
    <div class="overlay" id="overlay"></div>
    <div class="content" id="content">
      <div id="body-area" style="display:flex;flex-direction:column;flex:1;width:100%;"></div>
    </div>
  </div>
</body>
</html>
