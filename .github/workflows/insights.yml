name: Account Insights (read-only)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 UTC 00:00 = KST 09:00

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - name: Collect insights
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python insights.py
      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/
          git commit -m "report: weekly insights $(date +%F)" || echo "no changes"
          git push
