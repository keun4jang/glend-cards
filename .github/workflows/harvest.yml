name: Harvest Instagram Archive

# 인스타에 이미 올라간 게시물의 캡션·성과를 전량 회수해 archive/에 보관.
# media 브랜치가 매일 덮어써져 대본이 남지 않으므로, 인스타가 사실상 유일한 백업이다.
on:
  workflow_dispatch:
    inputs:
      no_metrics:
        description: "true면 성과 수치 없이 캡션만 빠르게 수집"
        required: false
        default: "false"
      probe:
        description: "true면 수집 대신, 어떤 지표가 실제로 되는지 API에 하나씩 물어봄"
        required: false
        default: "false"
  schedule:
    - cron: "0 1 * * 1"   # 매주 월요일 UTC 01:00 (KST 10:00) — 인사이트 리포트 직후

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - name: Harvest
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE }}
        run: |
          if [ "${{ github.event.inputs.probe }}" = "true" ]; then
            python harvest.py --probe
          elif [ "${{ github.event.inputs.no_metrics }}" = "true" ]; then
            python harvest.py --no-metrics
          else
            python harvest.py
          fi
      - name: Commit archive
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add archive/
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "archive: 인스타 게시물 회수 $(date +%F)"
          for i in 1 2 3 4; do
            git push && exit 0
            echo "푸시 실패, 리베이스 후 재시도 $i"
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || git rebase --abort
            sleep $((2 ** i))
          done
          echo "푸시 최종 실패"; exit 1

      # 실패·취소(시간 초과 포함) 즉시 텔레그램 알림 — 10/12~13 릴스 3편이 조용히 실패한 뒤 추가.
      # 체크아웃 실패에도 동작하도록 저장소 파일에 의존하지 않고 curl로 보낸다. 시크릿이 없으면 건너뛴다.
      - name: Notify failure (Telegram)
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: "🚨 GLEND ${{ github.workflow }} — ${{ job.status }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "텔레그램 미설정 — 알림 생략"; exit 0; fi
          curl -s -o /dev/null -w "telegram %{http_code}\n" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(printf '%b' "$MSG")" || true
