name: Daily Insta Post

on:
  schedule:
    # 월·수·금 KST 07:30 (= UTC 일·화·목 22:30).
    # 매일 3개(카드1+릴스2)를 53명뿐인 팔로워 피드에 밀어넣으면 서로 잡아먹는다.
    # 카드뉴스는 팔로워 밖으로 못 나가는 포맷이라, 빈도를 줄이고 릴스에 자리를 내준다.
    - cron: "30 22 * * 0,2,4"
  workflow_dispatch:   # 버튼으로 수동 실행도 가능
    inputs:
      reuse:
        description: "true면 기존 콘텐츠 재사용(재렌더+재발행)"
        required: false
        default: "false"
      index:
        description: "재발행할 content 번호 (1=경제 2=사건사고 3=건강)"
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    # 정상 실행은 길어야 1시간 남짓(랜덤 지연 50분 포함). 멈추면 6시간 기본 제한까지 붙잡지 않게.
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"   # print가 버퍼에 쌓여 멈춘 위치를 로그로 알 수 없었다(10/12 취소 건)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run daily pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE }}
          REUSE_CONTENT: ${{ github.event.inputs.reuse || 'false' }}
          CARD_INDEX: ${{ github.event.inputs.index || '' }}
        run: python daily_ci.py

      # 실패·취소(시간 초과 포함) 즉시 텔레그램 알림 — 10/12~13 릴스 3편이 조용히 실패한 뒤 추가.
      # 체크아웃 실패에도 동작하도록 저장소 파일에 의존하지 않고 curl로 보낸다. 시크릿이 없으면 건너뛴다.
      - name: Notify failure (Telegram)
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: "🚨 GLEND ${{ github.workflow }} — ${{ job.status }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "텔레그램 미설정 — 알림 생략"; exit 0; fi
          curl -s -o /dev/null -w "telegram %{http_code}\n" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(printf '%b' "$MSG")" || true
