name: Daily Insta Post

on:
  schedule:
    # 월·수·금 KST 07:30 (= UTC 일·화·목 22:30).
    # 매일 3개(카드1+릴스2)를 53명뿐인 팔로워 피드에 밀어넣으면 서로 잡아먹는다.
    # 카드뉴스는 팔로워 밖으로 못 나가는 포맷이라, 빈도를 줄이고 릴스에 자리를 내준다.
    - cron: "30 22 * * 0,2,4"
  workflow_dispatch:   # 버튼으로 수동 실행도 가능
    inputs:
      reuse:
        description: "true면 기존 콘텐츠 재사용(재렌더+재발행)"
        required: false
        default: "false"
      index:
        description: "재발행할 content 번호 (1=경제 2=사건사고 3=건강)"
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run daily pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE }}
          REUSE_CONTENT: ${{ github.event.inputs.reuse || 'false' }}
          CARD_INDEX: ${{ github.event.inputs.index || '' }}
        run: python daily_ci.py
